<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f7f5fb;--surface:#fff;--ink:#241d33;--muted:#675e7c;--line:#ddd6ea;--accent:#7357ad;--tint:#ebe5f5;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131f;--surface:#211b2d;--ink:#ece8f4;--muted:#aba2c0;--line:#352d47;--accent:#b9a2e6;--tint:#2d2542}}
:root[data-theme="dark"]{--bg:#17131f;--surface:#211b2d;--ink:#ece8f4;--muted:#aba2c0;--line:#352d47;--accent:#b9a2e6;--tint:#2d2542}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 14px}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:99px;font-weight:600;font-size:15px}
nav a:hover{background:var(--tint);color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:760px;margin:0 auto;padding:0 20px 60px}
.hero{padding:56px 0 36px}
.hero h1{font-size:clamp(40px,11vw,68px);letter-spacing:-.02em}
.hero .role{font-size:19px;color:var(--accent);font-weight:600;margin:12px 0 18px}
.hero p{max-width:60ch;margin:0 0 22px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;border:1.5px solid var(--accent);text-decoration:none;font-weight:600}
.btn.main{background:var(--accent);color:var(--bg)}
section{padding:34px 0;border-top:1px solid var(--line)}
h2{font-size:28px;margin-bottom:20px}
.item{margin-bottom:18px}
.item h3{font-size:19px}
.meta{color:var(--muted);font-size:15px}
.tl{border-left:2px solid var(--line);padding-left:18px;margin-left:4px}
.tl .item{position:relative}
.tl .item::before{content:"";position:absolute;left:-25px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chips li{background:var(--tint);color:var(--accent);padding:5px 13px;border-radius:99px;font-weight:600;font-size:15px}
.pub{margin:0 0 14px;padding-left:14px;border-left:3px solid var(--accent)}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:24px 20px 40px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav id="nav"></nav>
<main>

    <p id="bio"></p>
